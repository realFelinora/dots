[General]
# Renk teması: pembe | obsidyen | gece | kan | buz | sakura | nane
palette=pembe

# Arka plan resmi (tema klasörüne göre yol). Boşsa temanın renklerinde degrade.
# SDDM ev klasörüne erişemez; resmi tema klasörüne koy (ör. assets/background.png).
background=

# Profil resmi (tema klasörüne göre yol). Boşsa sistemdeki kullanıcı resmi, o da yoksa ikon.
avatar=

# Dağıtım logosu: arch | debian | ubuntu | fedora | nixos | opensuse | manjaro | endeavouros | ...
os=arch

# 24 saatlik saat
clock24=false

# Giriş ekranında bu kadar saniye hareketsiz kalınca karşılama ekranına dön
idleSeconds=30
